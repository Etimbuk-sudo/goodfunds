<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoodFunds Dashboard | Bank • Save • Invest • Grow</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
        <aside id="sidebar" class="sidebar">
            <div class="brand">
                <div class="brand-icon">G</div>
                <div>
                    <div class="brand-name">Good<span>Funds</span></div>
                    <small>Bank • Save • Invest • Grow</small>
                </div>
            </div>

            <div class="nav-label">MAIN MENU</div>
            <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
            <button class="nav-item" data-page="banking"><span class="nav-icon">▣</span>Banking</button>
            <button class="nav-item" data-page="savings"><span class="nav-icon">♧</span>Savings</button>
            <button class="nav-item" data-page="investments"><span class="nav-icon">↗</span>Investments</button>
            <button class="nav-item" data-page="loans"><span class="nav-icon">₦</span>Loans</button>
            <button class="nav-item" data-page="transfers"><span class="nav-icon">⇄</span>Transfers</button>

            <div class="nav-label">ACCOUNT</div>
            <button class="nav-item" data-page="profile"><span class="nav-icon">♙</span>Profile & Settings</button>

            <div class="sidebar-bottom">
                <button class="nav-item" id="logoutButton"><span class="nav-icon">↪</span>Log out</button>
                <div class="sidebar-user">
                    <div class="avatar" id="sidebarAvatar">G</div>
                    <div><strong id="sidebarName">Goodnews User</strong><small>Demo account</small></div>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:12px">
                    <button class="mobile-menu" id="menuButton" aria-label="Open menu">☰</button>
                    <h2 id="topbarTitle">Dashboard</h2>
                </div>
                <div class="topbar-right">
                    <button class="icon-button" id="notificationButton" aria-label="Notifications">♧</button>
                    <button class="icon-button" id="topProfile" aria-label="Open profile">G</button>
                </div>
            </header>

            <div id="content" class="content"></div>

            <nav class="bottom-nav">
                <button data-page="dashboard" class="active"><span>⌂</span>Home</button>
                <button data-page="banking"><span>▣</span>Banking</button>
                <button data-page="savings"><span>♧</span>Savings</button>
                <button data-page="investments"><span>↗</span>Invest</button>
                <button data-page="loans"><span>₦</span>Loans</button>
            </nav>
        </main>
    </div>

  <div id="modalBackdrop" class="modal-backdrop">
        <div class="modal">
            <h2 id="modalTitle">Confirm action</h2>
            <p id="modalDescription"></p>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modalCancel">Cancel</button>
                <button class="btn" id="modalConfirm">Confirm</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast" role="status"></div>

  <script src="js/app.js"></script>
</body>
</html>
