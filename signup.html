<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoodFunds | Sign up</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-auth-mode="signup">
  <main class="auth-screen">
    <section class="auth-card">
      <div class="brand">
        <div class="brand-icon">G</div>
        <div>
          <div class="brand-name">Good<span>Funds</span></div>
          <small>Bank • Save • Invest • Grow</small>
        </div>
      </div>
      <h1>Create your account</h1>
      <p>Create a local demo profile to explore GoodFunds.</p>
      <form id="authForm">
        
      <div class="form-group">
        <label for="authName">Full name</label>
        <input id="authName" name="name" placeholder="Your name" autocomplete="name" required>
      </div>
        <div class="form-group">
          <label for="authEmail">Email address</label>
          <input id="authEmail" name="email" type="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="authPassword">Password</label>
          <input id="authPassword" name="password" type="password" required minlength="6" placeholder="Your password" autocomplete="new-password">
        </div>
        <button class="btn btn-full" id="authSubmit" type="submit">Create demo account</button>
      </form>
      <div class="auth-switch">
        <span>Already have an account?</span>
        <a class="text-btn" href="login.html">Sign in</a>
      </div>
      <div class="notice">Prototype only. Do not enter real banking passwords, BVN, NIN or card details.</div>
      <div id="authMessage" class="muted" role="status" style="margin-top:12px;font-size:12px"></div>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
